<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waypoint Lead Intake</title>
  <script type="module" src="submit.js" defer></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0c1c2e, #0a2338);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #ffffff;
    }

    .form-box {
      background: #152a3f;
      border-radius: 12px;
      padding: 40px 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 20px rgba(86, 120, 155, 0.3);
      border: 1px solid #56789b44;
    }

    h2 {
      text-align: center;
      font-size: 28px;
      color: #66ccff;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(102, 204, 255, 0.3);
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: bold;
      color: #c0c0c0;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      background: #1c324a;
      border: 1px solid #56789b55;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: #66ccff;
      color: #0c1c2e;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(102, 204, 255, 0.3);
    }

    button:hover {
      background-color: #4eb1e4;
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(102, 204, 255, 0.5);
    }

    @media screen and (max-width: 600px) {
      .form-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Waypoint Lead Intake</h2>
    <button id="logoutBtn" style="float: right; background-color:#cc3333; color:white; padding:8px 14px; border:none; border-radius:4px; cursor:pointer;">Logout</button>
    <form id="leadForm">
      <label for="type">Lead Type</label>
      <select name="type" required>
        <option>Land Buyer</option>
        <option>Realtor</option>
        <option>Home Builder</option>
        <option>Surveyor</option>
        <option>Title Company</option>
      </select>

      <label for="name">Name</label>
      <input type="text" name="name" required />

      <label for="contact">Contact Info</label>
      <input type="text" name="contact" required />

      <label for="location">Location</label>
      <input type="text" name="location" />

      <label for="source">Where Found</label>
      <input type="text" name="source" />

      <label for="notes">Notes</label>
      <textarea name="notes" rows="4"></textarea>

      <button type="submit">Submit Lead</button>
    </form>
  </div>
</body>
</html>
