<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Waypoint Admin Dashboard</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f9f9f9;
        padding: 20px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
      }
      th {
        background-color: #56789b;
        color: white;
      }
      select,
      input {
        margin-bottom: 10px;
        padding: 5px;
      }
    </style>
    <script type="module" src="admin.js" defer></script>
  </head>
  <body>
    <h2>Waypoint Leads Dashboard</h2>

<button id="logoutBtn" style="
  float: right;
  background-color: #cc3333;
  color: white;
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 16px;
">
  Logout
</button>


<input type="text" id="searchInput" placeholder="Search by name or location" />

<label for="filterType">Filter by Lead Type:</label>
<select id="filterType">
  <option value="All">All</option>
  <option value="Land Buyer">Land Buyer</option>
  <option value="Realtor">Realtor</option>
  <option value="Home Builder">Home Builder</option>
</select>

<input type="text" id="searchInput" placeholder="Search by name or location" />

<label for="filterType">Filter by Lead Type:</label>
<select id="filterType">
  <option value="All">All</option>
  <option value="Land Buyer">Land Buyer</option>
  <option value="Realtor">Realtor</option>
  <option value="Home Builder">Home Builder</option>
  <option value="Surveyor">Surveyor</option>
  <option value="Title Company">Title Company</option>
</select>

<button id="queryBtn" style="
  margin: 12px 0;
  background-color: #66ccff;
  color: #0c1c2e;
  padding: 10px 16px;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
">🔍 Query Leads</button>

<button id="exportBtn" style="
  margin-left: 12px;
  background-color: #56789b;
  color: white;
  padding: 10px 16px;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
">📁 Export CSV</button>

<button id="exportBtn">Export CSV</button>

<table border="1" id="leadsTable">
  <thead>
    <tr>
      <th>Type</th>
      <th>Name</th>
      <th>Contact</th>
      <th>Location</th>
      <th>Source</th>
      <th>Notes</th>
      <th>Status</th>
      <th>Time</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

  </body>
</html>
