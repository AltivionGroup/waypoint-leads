<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Waypoint Admin Dashboard</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f9f9f9;
        padding: 20px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
      }
      th {
        background-color: #56789b;
        color: white;
      }
      select,
      input {
        margin-bottom: 10px;
        padding: 5px;
      }
    </style>
    <script type="module" src="admin.js" defer></script>
  </head>
  <body>
    <h2>Waypoint Geospatial – Admin Dashboard</h2>

    <label for="filterType">Filter by Lead Type:</label>
    <select id="filterType">
      <option value="">All</option>
      <option value="Land Buyer">Land Buyer</option>
      <option value="Realtor">Realtor</option>
      <option value="Home Builder">Home Builder</option>
      <option value="Surveyor">Surveyor</option>
      <option value="Title Company">Title Company</option>
    </select>

    <table id="leadsTable">
      <thead>
        <tr>
          <th>Type</th>
          <th>Name</th>
          <th>Contact</th>
          <th>Location</th>
          <th>Source</th>
          <th>Notes</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </body>
</html>
