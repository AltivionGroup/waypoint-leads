<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <title>Waypoint Admin Login</title>
  <script type="module" src="login.js" defer></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0c1c2e, #0a2338);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    form {
      background-color: #152a3f;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(86, 120, 155, 0.3);
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      color: #66ccff;
      margin-bottom: 24px;
    }

    input {
      margin-bottom: 16px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      background-color: #1f3b57;
      color: white;
      box-sizing: border-box;
    }

    input::placeholder {
      color: #a9c4d9;
    }

    #error {
      color: #ff6666;
      margin-top: 10px;
      text-align: center;
    }

    .primary-btn {
      background-color: #66ccff;
      color: #0c1c2e;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(102, 204, 255, 0.2);
    }

    .primary-btn:hover {
      background-color: #4eb1e4;
      box-shadow: 0 6px 14px rgba(102, 204, 255, 0.4);
    }

    .primary-btn:active {
      transform: scale(0.97);
    }

    .primary-btn:disabled {
      background-color: #b0dffc;
      color: #3a3a3a;
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>
>
  <body>
    <h2>Waypoint Admin Login</h2>
    <form id="loginForm">
      <input type="email" placeholder="Email" id="email" required />
      <input type="password" placeholder="Password" id="password" required />
      <button type="submit">Login</button>
    </form>
    <p id="error" style="color: red"></p>
  </body>
</html>
